services:
  backend:
    image: node:24-alpine
    container_name: ticket-dev-backend
    working_dir: /app/backend
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      PORT: 4000
      SESSION_SECRET: desarrollo-local-ticket
      COOKIE_SECURE: "false"
      CORS_ORIGIN: http://localhost:5173
      PUBLIC_URL: http://localhost:5173
      SEED_ADMIN_PASSWORD: ""
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_EMAIL: admin@empresa.com
    volumes:
      - ./backend:/app/backend
      - backend_node_modules:/app/backend/node_modules
      - ticket_data:/app/backend/data
      - ticket_uploads:/app/backend/uploads
    ports:
      - "4000:4000"

  frontend:
    image: node:24-alpine
    container_name: ticket-dev-frontend
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
  ticket_data:
    external: true
    name: ticket_ticket_data
  ticket_uploads:
    external: true
    name: ticket_ticket_uploads
