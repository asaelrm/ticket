services:
  backend:
    image: node:24-alpine
    container_name: ticket-dev-backend
    working_dir: /app/backend
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      PORT: 4000
      # --- Base de datos: SQL Server es el ÚNICO motor ----------------------
      # El desarrollo ya no usa SQLite. Ajuste estas variables (o el .env) para
      # apuntar a su SQL Server de desarrollo antes de arrancar.
      DB_CLIENT: mssql
      DB_SERVER: "${DB_SERVER:-}"
      DB_PORT: "${DB_PORT:-1433}"
      DB_DATABASE: "${DB_DATABASE:-}"
      DB_USER: "${DB_USER:-}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      DB_ENCRYPT: "${DB_ENCRYPT:-true}"
      DB_TRUST_SERVER_CERTIFICATE: "${DB_TRUST_SERVER_CERTIFICATE:-false}"
      DB_INSTANCE: "${DB_INSTANCE:-}"
      # Secreto de DESARROLLO. Es público a propósito y por eso la
      # aplicación lo rechaza en producción. No lo reutilice en ningún
      # despliegue real.
      SESSION_SECRET: desarrollo-local-ticket
      COOKIE_SECURE: "false"
      CORS_ORIGIN: http://localhost:5173
      PUBLIC_URL: http://localhost:5173
      # Primer arranque en local: defina SEED_ADMIN_PASSWORD (12+ caracteres)
      # para crear el administrador, entre y quítela. Sin ella no se crea
      # ninguna cuenta y no hay forma de entrar.
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-}"
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_EMAIL: admin@empresa.com
      # Cuentas de demostración: hay que pedirlas explícitamente, y además
      # indicar su contraseña (si no, nacen con una aleatoria inusable).
      #   $env:SEED_DEMO_ACCOUNTS = "true"
      #   $env:SEED_DEMO_PASSWORD = "<algo>"
      #   $env:SEED_TECH_PASSWORD = "<algo>"
      SEED_DEMO_ACCOUNTS: "${SEED_DEMO_ACCOUNTS:-false}"
      SEED_DEMO_PASSWORD: "${SEED_DEMO_PASSWORD:-}"
      SEED_TECH_PASSWORD: "${SEED_TECH_PASSWORD:-}"
    volumes:
      - ./backend:/app/backend
      - backend_node_modules:/app/backend/node_modules
      - ticket_data:/app/backend/data
      - ticket_uploads:/app/backend/uploads
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: node:24-alpine
    container_name: ticket-dev-frontend
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    healthcheck:
      # Vite con --host 0.0.0.0 escucha solo IPv4; en Alpine "localhost"
      # resuelve a ::1 primero y el wget de busybox falla (Connection refused).
      # 127.0.0.1 evita el falso "unhealthy" aunque el puerto responda.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  backend_node_modules:
  frontend_node_modules:
  ticket_data:
    external: true
    name: ticket_dev_data
  ticket_uploads:
    external: true
    name: ticket_dev_uploads
